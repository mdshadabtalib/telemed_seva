{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 class="mb-6">Doctor Profile</h1>
  <div class="card"><div class="card-body">
    <form method="POST" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row"><div class="form-group"><label class="form-label">First Name</label><input name="first_name" class="form-control" value="{{ profile.first_name }}" required></div><div class="form-group"><label class="form-label">Last Name</label><input name="last_name" class="form-control" value="{{ profile.last_name }}" required></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ profile.phone or '' }}"></div><div class="form-group"><label class="form-label">Specialty</label><select name="specialty_id" class="form-control"><option value="">Select Specialty</option>{% for s in specialties %}<option value="{{ s.id }}" {{ 'selected' if profile.specialty_id == s.id }}>{{ s.name }}</option>{% endfor %}</select></div></div>
      <div class="form-group"><label class="form-label">Qualifications</label><input name="qualifications" class="form-control" value="{{ profile.qualifications or '' }}" placeholder="e.g. MBBS, MD (Medicine)"></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Registration Number</label><input name="registration_number" class="form-control" value="{{ profile.registration_number or '' }}"></div><div class="form-group"><label class="form-label">Experience (years)</label><input type="number" name="experience_years" class="form-control" value="{{ profile.experience_years }}" min="0"></div></div>
      <div class="form-group"><label class="form-label">Languages (comma-separated)</label><input name="languages" class="form-control" value="{{ profile.languages or '' }}" placeholder="English, Hindi, Tamil"></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Consultation Fee ({{ currency }})</label><input type="number" name="consultation_fee" class="form-control" value="{{ profile.consultation_fee }}" step="0.01" min="0"></div><div class="form-group"><label class="form-label">Duration (minutes)</label><input type="number" name="consultation_duration" class="form-control" value="{{ profile.consultation_duration }}" min="5"></div></div>
      <div class="form-group"><label class="form-label">Bio</label><textarea name="bio" class="form-control" rows="3">{{ profile.bio or '' }}</textarea></div>
      <div class="form-group"><label class="form-label">Profile Photo</label><input type="file" name="avatar" class="form-control" accept="image/*"></div>
      <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save Profile</button>
    </form>
  </div></div>
</div>
{% endblock %}
