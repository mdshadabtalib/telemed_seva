{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 style="margin-bottom:var(--space-2);">My Profile</h1>
  <p class="text-muted mb-6">Manage your personal and medical information.</p>
  <div class="card">
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h3 class="mb-4">Personal Information</h3>
        <div class="form-row">
          <div class="form-group"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control" value="{{ profile.first_name }}" required></div>
          <div class="form-group"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control" value="{{ profile.last_name }}" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control" value="{{ profile.phone or '' }}"></div>
          <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" name="date_of_birth" class="form-control" value="{{ profile.date_of_birth.isoformat() if profile.date_of_birth else '' }}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Gender</label><select name="gender" class="form-control"><option value="">Select</option>{% for g in genders %}<option value="{{ g.value }}" {{ 'selected' if profile.gender == g }}>{{ g.value|replace('_',' ')|title }}</option>{% endfor %}</select></div>
          <div class="form-group"><label class="form-label">Blood Group</label><select name="blood_group" class="form-control"><option value="">Select</option>{% for bg in blood_groups %}<option value="{{ bg.value }}" {{ 'selected' if profile.blood_group == bg }}>{{ bg.value }}</option>{% endfor %}</select></div>
        </div>
        <div class="form-group"><label class="form-label">Profile Photo</label><input type="file" name="avatar" class="form-control" accept="image/*"></div>

        <h3 style="margin-top:var(--space-8);" class="mb-4">Medical Information</h3>
        <div class="form-group"><label class="form-label">Allergies</label><textarea name="allergies" class="form-control" rows="2" placeholder="List any known allergies...">{{ profile.allergies or '' }}</textarea></div>
        <div class="form-group"><label class="form-label">Medical History</label><textarea name="medical_history" class="form-control" rows="3" placeholder="Any pre-existing conditions, surgeries, etc.">{{ profile.medical_history or '' }}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Emergency Contact Name</label><input type="text" name="emergency_contact_name" class="form-control" value="{{ profile.emergency_contact_name or '' }}"></div>
          <div class="form-group"><label class="form-label">Emergency Contact Phone</label><input type="tel" name="emergency_contact_phone" class="form-control" value="{{ profile.emergency_contact_phone or '' }}"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
