<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#F0FDF4" />
  
  <!-- Medicine bottles -->
  <g transform="translate(100, 100)">
    <!-- Large bottle -->
    <rect x="-25" y="-20" width="25" height="40" rx="2" fill="url(#pharmaGrad)" opacity="0.9"/>
    <rect x="-25" y="-25" width="25" height="8" rx="1" fill="url(#pharmaGrad)"/>
    <rect x="-20" y="-15" width="15" height="6" fill="white" opacity="0.3" rx="1"/>
    
    <!-- Small bottle -->
    <rect x="5" y="-10" width="20" height="30" rx="2" fill="#3B82F6" opacity="0.8"/>
    <rect x="5" y="-14" width="20" height="6" rx="1" fill="#3B82F6"/>
    <rect x="9" y="-6" width="12" height="4" fill="white" opacity="0.3" rx="0.5"/>
    
    <!-- Pills -->
    <ellipse cx="-30" cy="30" rx="8" ry="6" fill="#EF4444" opacity="0.8"/>
    <ellipse cx="-15" cy="35" rx="7" ry="5" fill="#F59E0B" opacity="0.8"/>
    <ellipse cx="0" cy="32" rx="8" ry="6" fill="#8B5CF6" opacity="0.8"/>
    
    <!-- Capsules -->
    <g transform="translate(20, 30)">
      <rect x="-6" y="-3" width="12" height="6" rx="3" fill="#DC2626" opacity="0.9"/>
      <rect x="-6" y="-3" width="6" height="6" fill="#FCA5A5" opacity="0.6"/>
    </g>
    
    <!-- Medical cross -->
    <g transform="translate(-40, -35)" opacity="0.5">
      <rect x="-3" y="-8" width="6" height="16" fill="url(#pharmaGrad)" rx="1"/>
      <rect x="-8" y="-3" width="16" height="6" fill="url(#pharmaGrad)" rx="1"/>
    </g>
  </g>
</svg>
