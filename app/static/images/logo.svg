<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon Circle -->
  <circle cx="30" cy="30" r="26" fill="url(#logoGradient)" />
  
  <!-- Medical Cross with Heart -->
  <g transform="translate(30, 30)">
    <!-- Cross -->
    <rect x="-3" y="-14" width="6" height="28" fill="white" rx="1" />
    <rect x="-14" y="-3" width="28" height="6" fill="white" rx="1" />
    
    <!-- Small Heart in center -->
    <path d="M-4,-2 C-4,-4 -6,-4 -6,-2 C-6,0 -4,2 0,4 C4,2 6,0 6,-2 C6,-4 4,-4 4,-2 C4,-3 2,-3 0,-1 C-2,-3 -4,-3 -4,-2 Z" 
          fill="url(#heartGradient)" />
  </g>
  
  <!-- Text: TeleMed -->
  <text x="65" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">
    TeleMed
  </text>
  
  <!-- Text: Seva with different color -->
  <text x="145" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#4F46E5">
    Seva
  </text>
  
  <!-- Tagline -->
  <text x="65" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6B7280" letter-spacing="0.5">
    Healthcare at Your Fingertips
  </text>
</svg>
