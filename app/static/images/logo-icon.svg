<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="url(#iconGradient)" />
  
  <!-- Medical Cross with Heart -->
  <g transform="translate(30, 30)">
    <!-- Cross -->
    <rect x="-3.5" y="-16" width="7" height="32" fill="white" rx="1.5" />
    <rect x="-16" y="-3.5" width="32" height="7" fill="white" rx="1.5" />
    
    <!-- Heart in center -->
    <path d="M-5,-3 C-5,-6 -8,-6 -8,-3 C-8,1 -5,4 0,7 C5,4 8,1 8,-3 C8,-6 5,-6 5,-3 C5,-4 3,-4 0,-1 C-3,-4 -5,-4 -5,-3 Z" 
          fill="url(#heartGradient)" />
  </g>
</svg>
